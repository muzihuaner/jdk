<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JDK 下载中心-欢哥科技</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>JDK 下载中心</h1>
      </header>

      <div class="note-container">
        <div class="note-header">
          <span class="note-icon">ℹ️</span>
          <span class="note-title">Note:</span>
        </div>
        <div class="note-content" id="note-content">
          <!-- Note content will be loaded from JSON -->
        </div>
      </div>

      <div class="support-info">
        <h2 id="support-title">
          <!-- Support title will be loaded from JSON -->
        </h2>
        <ul id="support-list">
          <!-- Support list items will be loaded from JSON -->
        </ul>
      </div>

      <div class="accordion-container" id="accordion-container">
        <!-- Accordion items will be loaded from JSON -->
      </div>

      <div class="related-links" id="related-links">
        <b>更多版本下载</b>
        <ul id="related-links-list">
          <!-- Related links will be loaded from JSON -->
        </ul>
      </div>
    </div>
    <div style="text-align: center;margin-top: 20px;">
    <script type="text/javascript">
        copyright = new Date();//取得当前的日期
        update = copyright.getFullYear();//取得当前的年份
        document.write('<p >' + "Copyright © 2016-" + update + ' <a href="https://huangetech.github.io/" title="按下“Ctrl+D”试试？"><b>欢哥科技</b></a> All rights reserved. ' + '</p>');
    </script></div>
        <script src="script.js"></script>
  </body>
</html>
